name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Each experience builds into its own subfolder here, so multiple
      # apps can live side by side under one Pages site. Root stays a
      # placeholder until there's a real landing/entry page to put there.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pages-root/. _site/
          mkdir -p _site/valve-lineup
          cp -r dist/. _site/valve-lineup/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
